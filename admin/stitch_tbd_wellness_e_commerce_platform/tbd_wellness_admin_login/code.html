-center px-5 py-12 relative overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-ice-blue/80 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-primary-fixed/40 blur-3xl pointer-events-none"></div>
<div class="relative w-full max-w-md bg-surface-container-lowest rounded-lg shadow-xl p-8 md:p-10">
<div class="flex flex-col items-center text-center mb-8">
<img alt="TBD - Wellness" class="h-12 w-auto object-contain mb-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2TNc8K5OODvFbIMw0H29WZ5Izgy5O5vJAkI0_n_iCS5g1ERyrLvGC4fC8uC4LrB8tBPdyiXdy-PFT7agjEo6L-ldRs_kJn_Wa78i_tsOwdLQeMdNAzzPVWppaxN6FBNc9XKZr8UbT_5S8D4enrq0I3X4OLzGkhEit6bwuZ27RoFGhCXo_9h7DOUdmdSznk2XrHsqEdFH3lA9JG6ZQVYSs1MGG8m8OpxMveTc2uPaRxLWKUyuWBEtZ"/>
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-ice-blue text-primary-container mb-2">
<span class="w-1.5 h-1.5 rounded-full bg-vibrant-cyan animate-pulse"></span>
<span class="font-label-caps text-label-caps uppercase">Admin Portal</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Clinical Operations &amp; Formulation Control</p>
</div>
<form class="flex flex-col gap-5" id="admin-login-form" onsubmit="handleLoginSubmit(event)">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="admin-email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant text-[20px] pointer-events-none">mail</span>
<input autocomplete="email" class="w-full h-12 pl-11 pr-4 rounded-lg bg-soft-gray text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-ice-blue/60 transition-colors" id="admin-email" placeholder="admin@tbdwellness.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="admin-password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant text-[20px] pointer-events-none">lock</span>
<input autocomplete="current-password" class="w-full h-12 pl-11 pr-12 rounded-lg bg-soft-gray text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-ice-blue/60 transition-colors" id="admin-password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-1.5 rounded-full text-on-surface-variant hover:text-primary-container hover:bg-ice-blue transition-colors flex items-center justify-center" id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1">
<label class="inline-flex items-center gap-2.5 cursor-pointer select-none group">
<input class="sr-only peer" id="remember-me" type="checkbox"/>
<span class="w-5 h-5 rounded-md bg-ice-blue flex items-center justify-center text-on-primary peer-checked:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</span>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="font-label-md text-label-md text-primary-container hover:text-dark-blue transition-colors" href="#forgot-password" onclick="event.preventDefault()">
          Forgot Password?
        </a>
</div>
<button class="mt-2 w-full h-[52px] rounded-full bg-primary-container hover:bg-dark-blue text-on-primary font-subheading text-subheading flex items-center justify-center gap-2 shadow-md hover:-translate-y-0.5 transition-all cursor-pointer" id="signin-btn" type="submit">
<span>Sign In to Dashboard</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-6 bg-surface-container-low/60 -mx-8 -mb-8 md:-mx-10 md:-mb-10 px-8 py-4 rounded-b-lg flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary-container" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-body-sm text-body-sm">Authorized TBD - Wellness Personnel Only</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('admin-password');
    const icon = document.getElementById('toggle-password-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('signin-btn');
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Authenticating...</span>';
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = originalHTML;
    }, 1200);
  }
</script></main></body></html>
